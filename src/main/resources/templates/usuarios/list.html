<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - KinalApp</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>kinalApp</h2>
            <p>Menú</p>
        </div>
        <nav>
            <a href="/home" class="nav-item">Tablero</a>
            <a href="/web/productos" class="nav-item">Productos</a>
            <a href="/web/clientes" class="nav-item">Clientes</a>
            <a href="/web/ventas" class="nav-item">Ventas</a>
            <a sec:authorize="hasRole('ADMIN')" href="/web/usuarios" class="nav-item active">Usuarios</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="nav-item logout-btn">Cerrar Sesión</button>
            </form>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">Usuarios del Sistema</h1>
            <div class="user-info">
                <span><strong sec:authentication="name"></strong></span>
                <div class="user-avatar">
                    <span sec:authentication="name" th:text="${#strings.substring(#strings.toUpperCase(#strings.substring(_, 0, 1)), 0, 1)}">U</span>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Listado de Usuarios</h2>
                <a href="/web/usuarios/nuevo" class="btn-primary">+ Nuevo Usuario</a>
            </div>

            <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-error"><span th:text="${error}"></span></div>

            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.codigoUsuario}">1</td>
                    <td th:text="${usuario.username}">admin</td>
                    <td th:text="${usuario.email}">admin@kinalapp.com</td>
                    <td>
                        <span th:if="${usuario.rol == 'ADMIN'}" class="badge badge-active">Administrador</span>
                        <span th:if="${usuario.rol == 'USER'}" class="badge">Usuario</span>
                    </td>
                    <td>
                        <span th:if="${usuario.estado == 1}" class="badge badge-active">Activo</span>
                        <span th:if="${usuario.estado != 1}" class="badge badge-inactive">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{/web/usuarios/editar/{id}(id=${usuario.codigoUsuario})}" class="btn-secondary">Editar</a>
                        <a th:href="@{/web/usuarios/eliminar/{id}(id=${usuario.codigoUsuario})}"
                           class="btn-secondary btn-danger"
                           onclick="return confirm('¿Eliminar este usuario?')">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${usuarios.empty}">
                    <td colspan="6" style="text-align: center; padding: 48px;">
                        No hay usuarios registrados
                        <br><br>
                        <a href="/web/usuarios/nuevo" class="btn-primary">Crear primer usuario</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
