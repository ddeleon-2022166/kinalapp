<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KinalApp</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>kinalApp</h2>
            <p>Menú</p>
        </div>
        <nav>
            <a href="/home" class="nav-item">🏠 Tablero</a>
            <a href="/web/productos" class="nav-item">🛍️ Productos</a>
            <a href="/web/clientes" class="nav-item active">👤 Clientes</a>
            <a href="/web/ventas" class="nav-item">💰 Ventas</a>
            <a sec:authorize="hasRole('ADMIN')" href="/web/usuarios" class="nav-item">👥 Usuarios</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="nav-item logout-btn">📤 Cerrar Sesión</button>
            </form>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">Dashboard</h1>
            <div class="user-info">
                <span>Hola, <strong sec:authentication="name"></strong></span>
                <div class="user-avatar">
                    <span sec:authentication="name" th:text="${#strings.substring(#strings.toUpperCase(#strings.substring(_, 0, 1)), 0, 1)}">U</span>
                </div>
            </div>
        </div>

        <div class="welcome-card">
            <div class="welcome-icon">
                <span>✨</span>
            </div>
            <h1>¡Bienvenido!</h1>
            <p>Gestiona tus productos, clientes y ventas desde un solo lugar.</p>

            <div class="quick-actions">
                <a href="/web/productos/nuevo" class="quick-card">
                    <div>➕</div>
                    <strong>Nuevo Producto</strong>
                </a>
                <a href="/web/clientes/nuevo" class="quick-card">
                    <div>👤</div>
                    <strong>Nuevo Cliente</strong>
                </a>
                <a href="/web/ventas/nueva" class="quick-card">
                    <div>🛒</div>
                    <strong>Registrar Venta</strong>
                </a>
                <a href="/web/productos" class="quick-card">
                    <div>📊</div>
                    <strong>Ver Reportes</strong>
                </a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
