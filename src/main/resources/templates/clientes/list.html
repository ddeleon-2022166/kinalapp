<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Clientes - KinalApp</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>kinalApp</h2>
            <p>Menú</p>
        </div>
        <nav>
            <a href="/home" class="nav-item">Tablero</a>
            <a href="/web/productos" class="nav-item">Productos</a>
            <a href="/web/clientes" class="nav-item active">Clientes</a>
            <a href="/web/ventas" class="nav-item">Ventas</a>
            <a sec:authorize="hasRole('ADMIN')" href="/web/usuarios" class="nav-item">Usuarios</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="nav-item logout-btn">Cerrar Sesión</button>
            </form>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">Clientes</h1>
            <div class="user-info">
                <span><strong sec:authentication="name"></strong></span>
                <div class="user-avatar">
                    <span sec:authentication="name" th:text="${#strings.substring(#strings.toUpperCase(#strings.substring(_, 0, 1)), 0, 1)}">U</span>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Listado de Clientes</h2>
                <a href="/web/clientes/nuevo" class="btn-primary">Nuevo Cliente</a>
            </div>

            <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-error"><span th:text="${error}"></span></div>

            <table>
                <thead>
                <tr>
                    <th>DPI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.DPICliente}">1234567890123</td>
                    <td th:text="${cliente.nombreCliente}">Juan</td>
                    <td th:text="${cliente.apellidoCliente}">Pérez</td>
                    <td th:text="${cliente.direccion}">Ciudad</td>
                    <td>
                        <span th:if="${cliente.estado == 1}" class="badge badge-active">Activo</span>
                        <span th:if="${cliente.estado != 1}" class="badge badge-inactive">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{/web/clientes/editar/{dpi}(dpi=${cliente.DPICliente})}" class="btn-secondary">Editar</a>
                        <a th:href="@{/web/clientes/eliminar/{dpi}(dpi=${cliente.DPICliente})}"
                           class="btn-secondary btn-danger"
                           onclick="return confirm('¿Eliminar este cliente?')">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${clientes.empty}">
                    <td colspan="6" style="text-align: center; padding: 48px;">
                        No hay clientes registrados
                        <br><br>
                        <a href="/web/clientes/nuevo" class="btn-primary">Crear primer cliente</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
