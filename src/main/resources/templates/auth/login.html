<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Iniciar Sesión</title>
    <link rel="stylesheet" href="/styles.css?t=20260412">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">K</div>
            <h2>kinalapp</h2>
            <p class="login-subtitle">Sistema de Gestión</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            Usuario o contraseña incorrectos
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Has cerrado sesión exitosamente
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>📥 Usuario</label>
                <input type="text" name="username" placeholder="Ingresa tu usuario" required autofocus>
            </div>

            <div class="form-group">
                <label>🔐 Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Iniciar Sesión →</button>
        </form>
    </div>
</div>
</body>
</html>
